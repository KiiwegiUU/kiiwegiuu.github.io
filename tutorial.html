    <!-- ✅ ADDED: Backup/restore localStorage before anything else runs -->
    <script>
        (function () {
            const backupKey = '__progress_backup';
            const watchedKeys = ['rlprez_progress', 'lessonStatus', 'userProgress']; // Adjust if needed

            // Restore progress if missing
            const backup = localStorage.getItem(backupKey);
            if (backup) {
                try {
                    const { key, value } = JSON.parse(backup);
                    if (key && value && !localStorage.getItem(key)) {
                        localStorage.setItem(key, value);
                        console.log('✅ Progress restored from backup');
                    }
                } catch (e) {
                    console.warn('⚠️ Could not parse backup:', e);
                }
            }

            // Watch for updates to progress
            const originalSetItem = localStorage.setItem;
            localStorage.setItem = function (key, value) {
                if (watchedKeys.some(k => key.includes(k))) {
                    localStorage.setItem(backupKey, JSON.stringify({ key, value }));
                }
                return originalSetItem.apply(this, arguments);
            };
        })();
    </script>
    <!-- ✅ END ADDITION -->

    <!-- ✅ USAGE TRACKER (Google Sheets) -->
    <script>
        (function() {
            // 1. Paste your Google Apps Script Web App URL here
            const TRACKING_URL = "https://script.google.com/macros/s/AKfycbzPkQCAws14kEbo_4gnPUAW3hyICj_Nj4GNumw2nufD4FJG......";

            // 2. Generate or retrieve a persistent User ID
            let userId = localStorage.getItem('linguaBits_userId');
            if (!userId) {
                userId = 'user-' + Math.random().toString(36).substr(2, 7);
                localStorage.setItem('linguaBits_userId', userId);
            }

            // 3. Determine Access Method (PWA vs Browser)
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
            const accessMethod = isStandalone ? "Homescreen (PWA)" : "Web Browser";

            // 4. Determine Operating System
            function getOS() {
                const ua = navigator.userAgent;
                if (/android/i.test(ua)) return "Android";
                if (/iPad|iPhone|iPod/.test(ua)) return "iOS";
                if (/windows/i.test(ua)) return "Windows";
                if (/mac/i.test(ua)) return "Mac OS";
                if (/linux/i.test(ua)) return "Linux";
                return "Unknown";
            }
            const os = getOS();

			// 5. Send the payload to Google Sheets (Using an Image Beacon)
            function logUsage() {
                if (!TRACKING_URL) return; // Only abort if it's completely blank
                
                // Build the exact same URL you pasted into your browser bar
                const fullUrl = TRACKING_URL + 
                    "?userId=" + encodeURIComponent(userId) + 
                    "&accessMethod=" + encodeURIComponent(accessMethod) + 
                    "&os=" + encodeURIComponent(os);

                // FIRE AND FORGET: The browser requests the URL to "load an image".
                // This bypasses CORS and fetch restrictions entirely!
                new Image().src = fullUrl;
            }

            // Log the session as soon as the page loads
            window.addEventListener('load', () => {
                logUsage();
            });
        })();
    </script>

    <!-- ✅ Keep service worker and persistent storage setup -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('Service Worker registered:', reg))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }
        if ('storage' in navigator && 'persist' in navigator.storage) {
            navigator.storage.persist().then(granted => {
                if (granted) {
                    console.log('🔒 Test storage granted');
                } else {
                    console.warn('❗ Persistent storage not granted');
                }
            });
        }
    </script>
